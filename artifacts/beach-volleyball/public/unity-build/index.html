<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <!--
      Unity match brief (29 Sep), item 6: the 3D court's own page, not Unity's
      sample template. No Unity logo, no footer, no "volleyball" title: the
      canvas fills the 3D Court panel (pages/court.tsx) and follows its size.
      When the Unity instance is ready it tells the game page ("unity-loaded"),
      which hides its loading strip.
      The build's files keep their deployed names (Volleyball_WebGL_Uncompressed_2.*):
      scripts/compress-unity-data.cjs and the packaging check expect them.
    -->
    <title>Beach Volleyball Empire</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1622; }
      #court { position: fixed; inset: 0; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #0b1622; outline: none; }
      #loading {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(320px, 70vw); font: 600 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: rgba(255, 255, 255, 0.75); text-align: center; letter-spacing: 0.02em;
      }
      #loading .track { margin-top: 10px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
      #loading .fill { height: 100%; width: 0%; background: #f5b82e; transition: width 0.2s ease-out; }
      #error {
        display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        max-width: min(480px, 85vw); padding: 20px 24px; border-radius: 8px; background: #1a1a1a;
        border: 1px solid #ef4444; color: #fca5a5; font: 13px/1.6 ui-monospace, Consolas, monospace; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="court">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">Loading the court…<div class="track"><div class="fill" id="fill"></div></div></div>
      <div id="error"></div>
    </div>
    <script>
      var canvas = document.getElementById("unity-canvas");
      var buildUrl = "/unity-build/Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Volleyball_WebGL_Uncompressed_2.data",
        frameworkUrl: buildUrl + "/Volleyball_WebGL_Uncompressed_2.framework.js",
        codeUrl: buildUrl + "/Volleyball_WebGL_Uncompressed_2.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Bean & Label",
        productName: "Beach Volleyball Empire",
        productVersion: "1.0",
        // Warnings go to the console; only a failure to load is shown.
        showBanner: function (msg, type) { if (type === "error") showLoadError(msg); else console.warn(msg); },
      };

      function showLoadError(message) {
        document.getElementById("loading").style.display = "none";
        var e = document.getElementById("error");
        e.textContent = "The 3D court could not load.\n\n" + String(message);
        e.style.display = "block";
      }

      var script = document.createElement("script");
      script.src = buildUrl + "/Volleyball_WebGL_Uncompressed_2.loader.js";
      script.onerror = function () { showLoadError("Could not load " + script.src); };
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.getElementById("fill").style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          window.__vbeUnity = unityInstance;
          document.getElementById("loading").style.display = "none";
          // The game page (pages/court.tsx) waits for this to hide its loading strip.
          try { window.parent.postMessage("unity-loaded", "*"); } catch (e) { console.warn(e); }
        }).catch(showLoadError);
      };
      document.body.appendChild(script);

      // Final brief 5 Oct, Part C: the game page switches Auto / Manual during a match.
      window.addEventListener("message", function (e) {
        var d = e.data;
        if (!d || d.type !== "vbe-control-mode" || !window.__vbeUnity) return;
        try { window.__vbeUnity.SendMessage("MatchManager", "SetControlMode", d.mode === "manual" ? "manual" : "auto"); }
        catch (err) { console.warn(err); }
      });
    </script>
  </body>
</html>
