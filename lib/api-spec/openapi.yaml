openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Beach Volleyball Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: players
    description: Player management
  - name: teams
    description: Team management
  - name: matches
    description: Match management
  - name: seasons
    description: Season and ladder
  - name: contracts
    description: Player contracts
  - name: staff
    description: Staff and coaches
  - name: training
    description: Training sessions
  - name: finances
    description: Financial management
  - name: draft
    description: Player draft system
  - name: outfits
    description: Player outfits
  - name: locations
    description: Game locations
  - name: leaderboard
    description: Leaderboard
  - name: olympics
    description: Olympic Games management
  - name: medical
    description: Medical Centre and injury statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /profile:
    get:
      operationId: getProfile
      tags: [auth]
      summary: Get user game profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
    post:
      operationId: createProfile
      tags: [auth]
      summary: Create user game profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileInput"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update user game profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List all world locations
      responses:
        "200":
          description: All locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"

  /locations/{id}:
    get:
      operationId: getLocation
      tags: [locations]
      summary: Get a single location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Location detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"

  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: List all players for the user's team
      responses:
        "200":
          description: Player list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: createPlayer
      tags: [players]
      summary: Create a player (admin/dev use)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerInput"
      responses:
        "201":
          description: Player created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/free-agents:
    get:
      operationId: listFreeAgents
      tags: [players]
      summary: List players without a team (available to sign)
      responses:
        "200":
          description: Free agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get player detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update player data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{id}/outfit:
    patch:
      operationId: updatePlayerOutfit
      tags: [players]
      summary: Change a player's outfit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutfitAssignment"
      responses:
        "200":
          description: Outfit updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{id}/release:
    post:
      operationId: releasePlayer
      tags: [players]
      summary: Release a player from the team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{id}/retire:
    post:
      operationId: retirePlayer
      tags: [players]
      summary: Retire a player and add them to the Hall of Fame
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "403":
          description: Not your player
        "404":
          description: Player not found

  /players/{id}/scout:
    post:
      operationId: scoutPlayer
      tags: [players]
      summary: Have your scout assess a player's hidden potential
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scouting report with assessed potential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoutingResult"
        "400":
          description: No scout on staff

  /outfits:
    get:
      operationId: listOutfits
      tags: [outfits]
      summary: List all available outfits
      responses:
        "200":
          description: Outfits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Outfit"

  /team:
    get:
      operationId: getMyTeam
      tags: [teams]
      summary: Get the current user's team
      responses:
        "200":
          description: Team info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: No team yet
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create the user's team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update team info
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /team/roster:
    get:
      operationId: getTeamRoster
      tags: [teams]
      summary: Get team roster with player details
      responses:
        "200":
          description: Roster with players and staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamRoster"

  /team/swap-player:
    post:
      operationId: swapTeamPlayer
      tags: [teams]
      summary: Swap a player in/out of the active lineup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerSwap"
      responses:
        "200":
          description: Swap confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamRoster"

  /team/roster/{id}/role:
    patch:
      operationId: setPlayerRole
      tags: [teams]
      summary: Set a player's squad role (starter / interchange / reserve)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerRoleUpdate"
      responses:
        "200":
          description: Role updated, full roster returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamRoster"

  /contracts:
    get:
      operationId: listContracts
      tags: [contracts]
      summary: List all active contracts for the user's team
      responses:
        "200":
          description: Contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"
    post:
      operationId: signContract
      tags: [contracts]
      summary: Sign a player to a contract (max 1 year)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractInput"
      responses:
        "201":
          description: Contract signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"

  /contracts/{id}:
    get:
      operationId: getContract
      tags: [contracts]
      summary: Get a single contract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
    delete:
      operationId: terminateContract
      tags: [contracts]
      summary: Terminate a contract early
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contract terminated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"

  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List the user's team staff
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: hireStaff
      tags: [staff]
      summary: Hire a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInput"
      responses:
        "201":
          description: Staff hired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /staff/available:
    get:
      operationId: listAvailableStaff
      tags: [staff]
      summary: List staff available to hire
      responses:
        "200":
          description: Available staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"

  /staff/{id}:
    delete:
      operationId: fireStaff
      tags: [staff]
      summary: Fire a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Staff fired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /training:
    get:
      operationId: listTrainingSessions
      tags: [training]
      summary: List scheduled training sessions
      responses:
        "200":
          description: Training sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingSession"
    post:
      operationId: scheduleTraining
      tags: [training]
      summary: Schedule a training session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingInput"
      responses:
        "201":
          description: Training scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"

  /training/{id}/complete:
    post:
      operationId: completeTraining
      tags: [training]
      summary: Mark training as complete and apply stat gains
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Training completed with stat gains
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingResult"

  /training/team:
    post:
      operationId: scheduleTeamTraining
      tags: [training]
      summary: Schedule a training session for the entire active roster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamTrainingInput"
      responses:
        "201":
          description: Team training sessions created (one per active player)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingSession"

  /training/plan:
    get:
      operationId: getTrainingPlan
      tags: [training]
      summary: Get weekly training plan summary with morale and fitness
      responses:
        "200":
          description: Training plan overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingPlan"

  /matches:
    get:
      operationId: listMatches
      tags: [matches]
      summary: List all matches for the current season
      responses:
        "200":
          description: Match list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
    post:
      operationId: scheduleMatch
      tags: [matches]
      summary: Schedule a match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchInput"
      responses:
        "201":
          description: Match scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/{id}:
    get:
      operationId: getMatch
      tags: [matches]
      summary: Get match detail including weather and score
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/{id}/simulate:
    post:
      operationId: simulateMatch
      tags: [matches]
      summary: Simulate a match and get result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"

  /matches/{id}/lineup:
    patch:
      operationId: updateMatchLineup
      tags: [matches]
      summary: Update player lineup before or during a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineupUpdate"
      responses:
        "200":
          description: Lineup updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/upcoming:
    get:
      operationId: listUpcomingMatches
      tags: [matches]
      summary: Get next 5 upcoming matches with weather forecast
      responses:
        "200":
          description: Upcoming matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /seasons:
    get:
      operationId: listSeasons
      tags: [seasons]
      summary: List all seasons
      responses:
        "200":
          description: Seasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Season"
    post:
      operationId: startSeason
      tags: [seasons]
      summary: Start a new season
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeasonInput"
      responses:
        "201":
          description: Season started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"

  /seasons/current:
    get:
      operationId: getCurrentSeason
      tags: [seasons]
      summary: Get the current active season
      responses:
        "200":
          description: Current season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"

  /seasons/{id}/ladder:
    get:
      operationId: getSeasonLadder
      tags: [seasons]
      summary: Get the season standings ladder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Season ladder
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LadderEntry"

  /finances:
    get:
      operationId: listFinances
      tags: [finances]
      summary: List all financial transactions for the user's team
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceTransaction"
    post:
      operationId: addFinanceTransaction
      tags: [finances]
      summary: Add a financial transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceTransactionInput"
      responses:
        "201":
          description: Transaction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransaction"

  /finances/summary:
    get:
      operationId: getFinanceSummary
      tags: [finances]
      summary: Get financial summary with totals, income breakdown, expenses
      responses:
        "200":
          description: Finance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummary"

  /finances/wage-bill:
    get:
      operationId: getWageBill
      tags: [finances]
      summary: Get weekly and monthly player wage totals with per-player breakdown
      responses:
        "200":
          description: Wage bill summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WageBill"

  /finances/prize-money:
    get:
      operationId: getPrizeMoneySummary
      tags: [finances]
      summary: Get season prize money earned grouped by tour category
      responses:
        "200":
          description: Prize money summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrizeMoneySummary"

  /finances/sponsor-progress:
    get:
      operationId: getSponsorProgress
      tags: [finances]
      summary: Get accepted sponsor deals with current win progress
      responses:
        "200":
          description: Sponsor progress list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SponsorProgress"

  /finances/promo-deals:
    get:
      operationId: listPromoDeals
      tags: [finances]
      summary: List available sponsorship and promo deals
      responses:
        "200":
          description: Promo deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromoDeal"

  /finances/promo-deals/{id}/accept:
    post:
      operationId: acceptPromoDeal
      tags: [finances]
      summary: Accept a promo/sponsorship deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deal accepted and income recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransaction"

  /draft:
    get:
      operationId: getDraftPool
      tags: [draft]
      summary: Get current draft pool of available players
      responses:
        "200":
          description: Draft pool
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DraftPlayer"

  /draft/generate-class:
    post:
      operationId: generateDraftClass
      tags: [draft]
      summary: Generate a new draft class (quality influenced by Youth Academy level)
      responses:
        "200":
          description: New draft class
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DraftPlayer"
        "401":
          description: Unauthorized

  /draft/pick:
    post:
      operationId: draftPick
      tags: [draft]
      summary: Draft a player from the pool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftPickInput"
      responses:
        "201":
          description: Player drafted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get global leaderboard across all users/teams
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [teams]
      summary: Get dashboard summary (team stats, next match, finances, recent results)
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /olympics/countries:
    get:
      operationId: listOlympicCountries
      tags: [olympics]
      summary: List eligible Olympic countries with their squads
      responses:
        "200":
          description: List of eligible countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OlympicCountry"
        "401":
          description: Unauthorized

  /olympics/selection:
    get:
      operationId: getOlympicSelection
      tags: [olympics]
      summary: Get the current user's Olympic country selection
      responses:
        "200":
          description: Current selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OlympicSelection"
        "401":
          description: Unauthorized
        "404":
          description: No selection made yet
    post:
      operationId: saveOlympicSelection
      tags: [olympics]
      summary: Save the user's Olympic country selection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OlympicSelectionInput"
      responses:
        "200":
          description: Selection saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OlympicSelection"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
    delete:
      operationId: clearOlympicSelection
      tags: [olympics]
      summary: Clear the user's Olympic selection and remove all wildcard players
      description: >
        Called when the Olympic tournament concludes. Deletes the entire
        olympic_selections row for the user. Wildcard players (id: null) exist
        only inside this row's squad JSON and are permanently removed with it.
        They are never written to playersTable, contractsTable, draftTable, or
        any club roster.
      responses:
        "204":
          description: Selection cleared
        "401":
          description: Unauthorized
        "404":
          description: No selection to clear

  /facilities:
    get:
      operationId: getFacilities
      tags: [facilities]
      summary: Get all facilities for the team (auto-created at level 1 if missing)
      responses:
        "200":
          description: List of facilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Facility"
        "401":
          description: Unauthorized

  /facilities/{type}/upgrade:
    post:
      operationId: upgradeFacility
      tags: [facilities]
      summary: Upgrade a facility to the next level
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Upgraded facility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facility"
        "400":
          description: Already at max level or insufficient budget
        "401":
          description: Unauthorized
        "404":
          description: Facility not found

  /trophies/hall-of-fame:
    get:
      operationId: getHallOfFame
      tags: [trophies]
      summary: Get all retired players in the Hall of Fame
      responses:
        "200":
          description: Hall of Fame entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HallOfFameEntry"
        "401":
          description: Unauthorized

  /trophies/cabinet:
    get:
      operationId: getTrophyCabinet
      tags: [trophies]
      summary: Get the manager's full trophy cabinet and career achievements
      responses:
        "200":
          description: Trophy cabinet data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrophyCabinet"
        "401":
          description: Unauthorized
        "404":
          description: Team not found

  /medical/injury-history:
    get:
      operationId: getInjuryHistory
      tags: [medical]
      summary: Get season injury history for the current team (newest first)
      responses:
        "200":
          description: List of injury history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InjuryHistoryEntry"
        "401":
          description: Unauthorized
        "404":
          description: No team found

  /medical/workload:
    get:
      operationId: getPlayerWorkloads
      tags: [medical]
      summary: Get workload status for all players (last 14 days)
      responses:
        "200":
          description: Per-player workload data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerWorkload"
        "401":
          description: Unauthorized
        "404":
          description: No team found

  /medical/injury-stats:
    get:
      operationId: getSeasonInjuryStats
      tags: [medical]
      summary: Get season injury statistics for the current team
      responses:
        "200":
          description: Season injury statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonInjuryStats"
        "401":
          description: Unauthorized
        "404":
          description: No team found

  /wellbeing/status:
    get:
      operationId: getWellbeingStatus
      tags: [wellbeing]
      summary: Get active wellbeing effects and team budget
      responses:
        "200":
          description: Wellbeing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellbeingStatus"
        "401":
          description: Unauthorized

  /wellbeing/run:
    post:
      operationId: runWellbeingCamp
      tags: [wellbeing]
      summary: Run a wellbeing camp for the team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCampInput"
      responses:
        "200":
          description: Camp completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellbeingResult"
        "400":
          description: Invalid camp type or insufficient funds
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string
        profileImage:
          type: ["string", "null"]
        hasProfile:
          type: boolean

    UserProfile:
      type: object
      required: [id, userId, teamName, totalWins, totalLosses, totalEarnings, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        teamName:
          type: string
        totalWins:
          type: integer
        totalLosses:
          type: integer
        totalEarnings:
          type: number
        createdAt:
          type: string

    UserProfileInput:
      type: object
      required: [teamName]
      properties:
        teamName:
          type: string

    UserProfileUpdate:
      type: object
      properties:
        teamName:
          type: string

    Location:
      type: object
      required: [id, name, country, city, description, weatherPatterns, imageUrl, courtType]
      properties:
        id:
          type: integer
        name:
          type: string
        country:
          type: string
        city:
          type: string
        description:
          type: string
        weatherPatterns:
          type: array
          items:
            type: string
        imageUrl:
          type: string
        courtType:
          type: string
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]

    Player:
      type: object
      required: [id, name, nationality, age, height, position, speed, power, defense, serve, block, stamina, morale, fatigue, fitness, injuryStatus, injuryWeeksRemaining, consecutiveMatchesPlayed, doctorQuality, trainingPoints, salary, teamId, outfitId, isActive, imageUrl, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        nationality:
          type: string
        age:
          type: integer
        height:
          type: number
        position:
          type: string
          enum: [setter, libero, outside_hitter, middle_blocker, opposite, universal]
        speed:
          type: integer
        power:
          type: integer
        defense:
          type: integer
        serve:
          type: integer
        block:
          type: integer
        stamina:
          type: integer
        morale:
          type: integer
        fatigue:
          type: integer
          description: Player fatigue level 0-100. High fatigue reduces performance.
        fitness:
          type: integer
          description: Player fitness level 0-100. Drops with matches and training; recovers with rest.
        injuryStatus:
          type: string
          enum: [Healthy, Minor Injury, Major Injury, Unavailable]
          description: Current injury state of the player.
        injuryWeeksRemaining:
          type: integer
          description: Number of weeks until the player recovers from injury. 0 when healthy.
        consecutiveMatchesPlayed:
          type: integer
          description: Number of matches played back-to-back without rest. High values increase injury risk.
        doctorQuality:
          type: integer
          minimum: 1
          maximum: 5
          description: Quality of medical care assigned to this player (1 = basic, 5 = elite). Affects recovery speed.
        trainingPoints:
          type: integer
          description: Accumulated training XP. Every 100 points converts to +1 in the trained stat. Never resets between seasons.
        salary:
          type: number
        teamId:
          type: ["integer", "null"]
        outfitId:
          type: ["integer", "null"]
        isActive:
          type: boolean
        squadRole:
          type: string
          enum: [starter, interchange, reserve]
          description: "Player's squad role: starter (match player), interchange (bench sub), or reserve."
        imageUrl:
          type: ["string", "null"]
        contractEndDate:
          type: ["string", "null"]
        scoutedPotential:
          type: ["string", "null"]
          enum: ["Low", "Average", "High", "Elite", "Generational", null]
          description: "Scout's assessment of player potential. Null if the player has not been scouted yet."
        createdAt:
          type: string

    PlayerInput:
      type: object
      required: [name, nationality, age, height, position, speed, power, defense, serve, block, stamina, salary]
      properties:
        name:
          type: string
        nationality:
          type: string
        age:
          type: integer
        height:
          type: number
        position:
          type: string
        speed:
          type: integer
        power:
          type: integer
        defense:
          type: integer
        serve:
          type: integer
        block:
          type: integer
        stamina:
          type: integer
        salary:
          type: number

    PlayerUpdate:
      type: object
      properties:
        name:
          type: string
        isActive:
          type: boolean
        morale:
          type: integer

    OutfitAssignment:
      type: object
      required: [outfitId]
      properties:
        outfitId:
          type: integer

    Outfit:
      type: object
      required: [id, name, primaryColor, secondaryColor, description, price, imageUrl]
      properties:
        id:
          type: integer
        name:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
        description:
          type: string
        price:
          type: number
        imageUrl:
          type: ["string", "null"]

    Team:
      type: object
      required: [id, userId, name, budget, reputation, wins, losses, titlesWon, locationId, createdAt, managerRepPoints, winStreak]
      properties:
        id:
          type: integer
        userId:
          type: string
        name:
          type: string
        budget:
          type: number
        reputation:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        titlesWon:
          type: integer
        locationId:
          type: ["integer", "null"]
        logoColor:
          type: ["string", "null"]
        trainingPhilosophy:
          type: ["string", "null"]
          enum: ["Power Volleyball", "Fast Volleyball", "Defensive Volleyball", null]
          description: "Team-wide training philosophy; provides small XP bonuses to related programs."
        managerRepPoints:
          type: integer
          description: "Manager reputation XP — used to derive level (1–5) and progress to next level"
        winStreak:
          type: integer
          description: "Current consecutive-win streak"
        createdAt:
          type: string

    TeamInput:
      type: object
      required: [name, locationId]
      properties:
        name:
          type: string
        locationId:
          type: integer
        logoColor:
          type: string

    TeamUpdate:
      type: object
      properties:
        name:
          type: string
        locationId:
          type: integer
        logoColor:
          type: string
        trainingPhilosophy:
          type: ["string", "null"]
          enum: ["Power Volleyball", "Fast Volleyball", "Defensive Volleyball", null]

    TeamRoster:
      type: object
      required: [team, starters, interchanges, reserves, activePlayers, benchPlayers, staff]
      properties:
        team:
          $ref: "#/components/schemas/Team"
        starters:
          type: array
          items:
            $ref: "#/components/schemas/Player"
        interchanges:
          type: array
          items:
            $ref: "#/components/schemas/Player"
        reserves:
          type: array
          items:
            $ref: "#/components/schemas/Player"
        activePlayers:
          type: array
          description: "Legacy: starters + interchanges combined."
          items:
            $ref: "#/components/schemas/Player"
        benchPlayers:
          type: array
          description: "Legacy: same as reserves."
          items:
            $ref: "#/components/schemas/Player"
        staff:
          type: array
          items:
            $ref: "#/components/schemas/StaffMember"

    PlayerRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [starter, interchange, reserve]

    PlayerSwap:
      type: object
      required: [playerInId, playerOutId]
      properties:
        playerInId:
          type: integer
        playerOutId:
          type: integer

    Contract:
      type: object
      required: [id, playerId, teamId, salary, startDate, endDate, bonusPerWin, status, createdAt]
      properties:
        id:
          type: integer
        playerId:
          type: integer
        teamId:
          type: integer
        salary:
          type: number
        startDate:
          type: string
        endDate:
          type: string
        bonusPerWin:
          type: number
        status:
          type: string
          enum: [active, expired, terminated]
        player:
          $ref: "#/components/schemas/Player"
        createdAt:
          type: string

    ContractInput:
      type: object
      required: [playerId, salary, endDate, bonusPerWin]
      properties:
        playerId:
          type: integer
        salary:
          type: number
        endDate:
          type: string
        bonusPerWin:
          type: number

    StaffMember:
      type: object
      required: [id, name, role, specialty, salary, skillLevel, age, overallRating, contractLength, coachSpeciality, personality, teamId, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          enum: [head_coach, assistant_coach, fitness_trainer, physio, nutritionist, scout, manager, physiotherapist, strength_coach]
        specialty:
          type: string
        salary:
          type: number
        skillLevel:
          type: integer
        age:
          type: integer
        overallRating:
          type: integer
          description: "Coach quality rating 50–99. Scales training XP gains from ×0.75 (rating 50) to ×1.24 (rating 99)."
        contractLength:
          type: integer
          description: "Contract duration in months."
        coachSpeciality:
          type: string
          enum: [Technical, Athletic, Defensive, Conditioning, "Youth Development", General]
          description: "Determines which stats get a training bonus."
        personality:
          type: string
          enum: [Motivator, Demanding, "Player Friendly", Disciplinarian]
          description: "Affects XP multiplier and morale/fatigue side-effects."
        teamId:
          type: ["integer", "null"]
        nationality:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    StaffInput:
      type: object
      required: [staffId]
      properties:
        staffId:
          type: integer

    TrainingSession:
      type: object
      required: [id, teamId, playerId, type, focus, durationHours, scheduledAt, status, coachId]
      properties:
        id:
          type: integer
        teamId:
          type: integer
        playerId:
          type: integer
        type:
          type: string
          enum: ["Power Camp", "Agility Camp", "Serving Academy", "Defensive Systems", "Conditioning", "Recovery Program"]
        focus:
          type: string
        durationHours:
          type: number
        scheduledAt:
          type: string
        status:
          type: string
          enum: [scheduled, completed, cancelled]
        coachId:
          type: ["integer", "null"]
        player:
          $ref: "#/components/schemas/Player"
        coach:
          $ref: "#/components/schemas/StaffMember"
        createdAt:
          type: string

    TrainingInput:
      type: object
      required: [playerId, type, durationHours, scheduledAt]
      properties:
        playerId:
          type: integer
        type:
          type: string
          enum: ["Power Camp", "Agility Camp", "Serving Academy", "Defensive Systems", "Conditioning", "Recovery Program"]
        focus:
          type: string
        durationHours:
          type: number
        scheduledAt:
          type: string
        coachId:
          type: ["integer", "null"]

    TrainingResult:
      type: object
      required: [session, statGains, newStats]
      properties:
        session:
          $ref: "#/components/schemas/TrainingSession"
        statGains:
          type: object
          properties:
            speed: { type: integer }
            power: { type: integer }
            defense: { type: integer }
            serve: { type: integer }
            block: { type: integer }
            stamina: { type: integer }
        newStats:
          $ref: "#/components/schemas/Player"
        xpGained:
          type: integer
        baseXp:
          type: integer
        xpToNextStat:
          type: integer
        ageModifier:
          type: number
        philosophyMultiplier:
          type: number
        programName:
          type: string
        coachEffect:
          type: object
          nullable: true

    TeamTrainingInput:
      type: object
      required: [type, durationHours, scheduledAt]
      properties:
        type:
          type: string
          enum: ["Power Camp", "Agility Camp", "Serving Academy", "Defensive Systems", "Conditioning", "Recovery Program"]
        focus:
          type: string
        durationHours:
          type: number
        scheduledAt:
          type: string
        coachId:
          type: ["integer", "null"]

    TrainingPlan:
      type: object
      required: [weeklyLoad, averageFitness, averageMorale, scheduledSessions, completedThisWeek]
      properties:
        weeklyLoad:
          type: string
          enum: [light, moderate, intense, peak]
        averageFitness:
          type: number
        averageMorale:
          type: number
        averageFatigue:
          type: number
        scheduledSessions:
          type: array
          items:
            $ref: "#/components/schemas/TrainingSession"
        completedThisWeek:
          type: integer

    Match:
      type: object
      required: [id, homeTeamId, awayTeamId, locationId, weather, status, season, round, teamSize, createdAt]
      properties:
        id:
          type: integer
        homeTeamId:
          type: integer
        awayTeamId:
          type: integer
        locationId:
          type: integer
        weather:
          type: string
          enum: [sunny, cloudy, windy, hot, overcast, stormy, perfect]
        windSpeed:
          type: ["number", "null"]
        temperature:
          type: ["number", "null"]
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled]
        season:
          type: integer
        round:
          type: integer
        teamSize:
          type: integer
        homeScore:
          type: ["integer", "null"]
        awayScore:
          type: ["integer", "null"]
        homeTeamName:
          type: ["string", "null"]
        awayTeamName:
          type: ["string", "null"]
        locationName:
          type: ["string", "null"]
        prizeAmount:
          type: ["number", "null"]
        scheduledAt:
          type: ["string", "null"]
        lineup:
          type: ["array", "null"]
          items:
            type: integer
        createdAt:
          type: string

    MatchInput:
      type: object
      required: [awayTeamId, locationId, season, round, teamSize, scheduledAt]
      properties:
        awayTeamId:
          type: integer
        locationId:
          type: integer
        season:
          type: integer
        round:
          type: integer
        teamSize:
          type: integer
        scheduledAt:
          type: string
        prizeAmount:
          type: number

    MatchResult:
      type: object
