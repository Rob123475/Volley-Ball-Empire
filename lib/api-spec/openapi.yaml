      properties:
        match:
          $ref: "#/components/schemas/Match"
        highlights:
          type: array
          items:
            type: string
        homeScore:
          type: integer
        awayScore:
          type: integer
        winner:
          type: string
          enum: [home, away, draw]
        prizeEarned:
          type: number
        mvp:
          $ref: "#/components/schemas/Player"
        playerEvents:
          type: array
