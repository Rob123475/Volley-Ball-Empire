                type: integer

    LineupUpdate:
      type: object
      required: [playerIds]
      properties:
        playerIds:
          type: array
          items:
            type: integer

    Season:
      type: object
      required: [id, year, name, status, totalRounds, currentRound, startDate, endDate]
      properties:
        id:
          type: integer
        year:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [upcoming, active, completed]
        totalRounds:
          type: integer
        currentRound:
          type: integer
        startDate:
          type: string
        endDate:
          type: string

    SeasonInput:
      type: object
      required: [year, name, totalRounds, startDate, endDate]
      properties:
        year:
          type: integer
        name:
          type: string
        totalRounds:
          type: integer
        startDate:
          type: string
        endDate:
          type: string

    LadderEntry:
