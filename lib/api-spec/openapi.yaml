        type:
          type: string
        amount:
          type: number
        description:
          type: string
        category:
          type: string
        date:
          type: string

    FinanceSummary:
      type: object
      required: [totalBalance, totalIncome, totalExpenses, monthlyIncome, monthlyExpenses, incomeSources, expenseBreakdown, recentTransactions]
      properties:
        totalBalance:
          type: number
        totalIncome:
          type: number
        totalExpenses:
          type: number
        monthlyIncome:
          type: number
        monthlyExpenses:
          type: number
        incomeSources:
          type: object
          properties:
            prizeMoney: { type: number }
            sponsorships: { type: number }
            promoDeals: { type: number }
        expenseBreakdown:
          type: object
          properties:
            playerSalaries: { type: number }
            staffSalaries: { type: number }
            trainingCosts: { type: number }
            other: { type: number }
        recentTransactions:
          type: array
          items:
            $ref: "#/components/schemas/FinanceTransaction"

    WageBillPlayer:
      type: object
      required: [id, name, tier, weeklySalary]
      properties:
        id:
          type: integer
        name:
          type: string
        tier:
          type: string
        weeklySalary:
          type: number

    WageBill:
      type: object
      required: [weeklyWages, monthlyWages, playerCount, players]
      properties:
        weeklyWages:
          type: number
        monthlyWages:
          type: number
        playerCount:
          type: integer
        players:
          type: array
          items:
            $ref: "#/components/schemas/WageBillPlayer"

    PrizeMoneyCategory:
      type: object
      required: [category, amount, matches]
      properties:
        category:
          type: string
        amount:
          type: number
        matches:
          type: integer

    PrizeMoneySummary:
      type: object
      required: [total, breakdown]
      properties:
        total:
          type: number
        breakdown:
          type: array
          items:
            $ref: "#/components/schemas/PrizeMoneyCategory"

    SponsorProgress:
      type: object
      required: [id, sponsor, description, amount, requirementWins, expiresAt, imageUrl, currentWins, progressPct, isComplete]
      properties:
        id:
          type: integer
        sponsor:
          type: string
        description:
          type: string
        amount:
          type: number
        requirementWins:
          type: integer
        expiresAt:
          type: string
        imageUrl:
          type: ["string", "null"]
        currentWins:
          type: integer
        progressPct:
          type: integer
        isComplete:
          type: boolean

    PromoDeal:
      type: object
      required: [id, sponsor, description, amount, requirementWins, expiresAt, isAccepted]
      properties:
        id:
          type: integer
        sponsor:
          type: string
        description:
          type: string
        amount:
          type: number
        requirementWins:
          type: integer
        expiresAt:
          type: string
        isAccepted:
          type: boolean
        imageUrl:
          type: ["string", "null"]

    DraftPlayer:
      type: object
      required: [id, name, nationality, age, height, position, speed, power, defense, serve, block, stamina, askingPrice, available]
      properties:
        id:
          type: integer
        name:
          type: string
        nationality:
          type: string
        age:
          type: integer
        height:
          type: number
        position:
          type: string
        speed:
          type: integer
        power:
          type: integer
        defense:
          type: integer
        serve:
          type: integer
        block:
          type: integer
        stamina:
          type: integer
        askingPrice:
          type: number
        available:
          type: boolean
        imageUrl:
          type: ["string", "null"]

    DraftPickInput:
      type: object
      required: [draftPlayerId]
